name: Publicar en Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-produccion
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar acceso a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN?.trim();
          const account = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          if (!token || !account) {
            console.error('::error::Faltan los secretos CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID.');
            process.exit(1);
          }
          if (!/^[a-f0-9]{32}$/i.test(account)) {
            console.error('::error::CLOUDFLARE_ACCOUNT_ID debe contener el ID de cuenta de 32 caracteres.');
            process.exit(1);
          }
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/rift-sanctum`, {
            headers: { Authorization: `Bearer ${token}` },
            signal: AbortSignal.timeout(30000),
          });
          const data = await response.json();
          if (!response.ok || !data.success) {
            console.error('::error::Cloudflare rechazó el acceso a rift-sanctum. Revisar el token, su vigencia, el permiso Account / Cloudflare Pages / Edit y que CLOUDFLARE_ACCOUNT_ID corresponda a la cuenta del proyecto.');
            process.exit(1);
          }
          console.log('Acceso al proyecto Cloudflare Pages verificado.');
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar sitio y funciones
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rift-sanctum --branch=main
